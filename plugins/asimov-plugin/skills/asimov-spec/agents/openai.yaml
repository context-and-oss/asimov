# Codex metadata for the asimov-spec asimov-skill (D101-spec-stage §6.1, NF5, NF6).
# The conversation lives in ../SKILL.md, the same file Claude Code reads.
# Codex skills take no arguments: the author names the D101 slug in the same message.
interface:
  display_name: "Asimov · Spec"
  short_description: "Plan a D101 into an S101 and its S102s"
  default_prompt: "Use $asimov-plugin:asimov-spec to plan the D101 <slug> into documentation/specs/<slug>/."

policy:
  # Only a person starts a planning run; the model never selects this skill (NF5).
  allow_implicit_invocation: false
