# Codex metadata for the asimov-spec asimov-skill (D101-spec-stage §6.1, NF5, NF6).
# The conversation lives in ../SKILL.md, the same file Claude Code reads.
# Codex skills take no arguments: the author names the D101 slug in the same message.
# Implicit invocation is allowed: the description in ../SKILL.md is the trigger, and the skill's own
# repo gate asks before writing in a repository that has no asimov.md marker.
interface:
  display_name: "Asimov · Spec"
  short_description: "Plan a D101 or a ticket into an S101 and its S102s; your go approves the plan"
  default_prompt: "Use $asimov-plugin:asimov-spec to plan the D101 <slug> into specs/<slug>/."
