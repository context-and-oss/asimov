# Codex metadata for the asimov-design skill (D101-design-stage).
# The conversation lives in ../SKILL.md, the same file Claude Code reads.
# Codex skills take no arguments: the author names the feature, the D101 or the legacy .md in the same message.
# Implicit invocation is allowed: the description in ../SKILL.md is the trigger, and the skill's own
# repo gate asks before writing in a repository that has no asimov.md marker.
interface:
  display_name: "Asimov · Design"
  short_description: "Design, continue, edit or review a feature design (D101), or render a legacy markdown one"
  default_prompt: "Use $asimov-plugin:asimov-design to design <the feature>, or to continue, edit or review the D101 <slug> under documentation/features/."
