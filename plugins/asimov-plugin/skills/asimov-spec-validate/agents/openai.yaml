# Codex metadata for the asimov-spec-validate asimov-skill (D101-spec-stage §6.1, NF5, NF6).
# The conversation lives in ../SKILL.md, the same file Claude Code reads.
# Codex skills take no arguments: the author names the slug in the same message.
interface:
  display_name: "Asimov · Spec validate"
  short_description: "Re-check a spec plan after a hand edit; writes only its sidecar"
  default_prompt: "Use $asimov-plugin:asimov-spec-validate on the plan <slug> under documentation/specs/<slug>/."

policy:
  # Only a person starts a re-check; the model never selects this skill (NF5).
  allow_implicit_invocation: false
