# Codex metadata for the asimov-init asimov-skill (D101-asimov-init §6.1; D100 §4.3).
# The conversation lives in ../SKILL.md, the same file Claude Code reads.
# Codex skills take no arguments: a repo-name override, if any, is the text after the invocation.
interface:
  display_name: "Asimov · Init"
  short_description: "Make a repo Asimov-ready for Claude Code and Codex: context, shells, conventions, project info, site"
  default_prompt: "Use $asimov-plugin:asimov-init to make this repo Asimov-ready."

policy:
  # Only a person sets a repo up; the model never selects this skill.
  allow_implicit_invocation: false
