name: Asimov PR
run-name: "PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"

# The PR gate (D101-agnostic-toolkit-codex-support §6.2, §7.3): generated trees are produced by
# CI only and live on release tags, never on main — so a PR must (a) not introduce them into the
# tracked tree, (b) leave the generator deterministic — proven by generating twice and
# byte-comparing the two runs (NF1, AC6) — and (c) keep the one hand-maintained manifest
# (.claude-plugin/marketplace.json) in step with the generated plugin manifest (hard rule 2,
# D100 §10 Q2). The generator's own tests run here too; they carry the artifact-maturity check
# (D101-artifact-maturity) and the plugin-root path check. The job id `ci` is the required status
# check in the main ruleset — keep them in sync.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id must stay `ci` — the org ruleset requires a status check with that name.
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse generated trees in the tracked diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          # --diff-filter=d: deletions are fine (removing generated files from tracking is
          # legitimate cleanup); adding or modifying tracked files there is the violation.
          touched=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}"...HEAD -- 'plugins/' '.agents/' || true)
          if [ -n "$touched" ]; then
            echo "::error::This PR commits files under the generated trees — change source/ instead; the release workflow produces the generated trees on the release tag (rule 1):"
            echo "$touched"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install generator
        working-directory: generator
        run: npm ci

      - name: Type-check and unit tests
        working-directory: generator
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate twice, byte-compare (determinism gate)
        working-directory: generator
        run: |
          node src/generate.ts --out /tmp/gen-a
          node src/generate.ts --out /tmp/gen-b
          diff -r /tmp/gen-a /tmp/gen-b
          echo "Two runs byte-identical."

      - name: Marketplace manifest agrees with the generated plugin manifest (hard rule 2)
        run: |
          set -euo pipefail
          mp=.claude-plugin/marketplace.json
          pj=/tmp/gen-a/plugins/asimov-plugin/.claude-plugin/plugin.json
          jq empty "$mp" "$pj" /tmp/gen-a/.agents/plugins/marketplace.json /tmp/gen-a/plugins/asimov-plugin-codex/.codex-plugin/plugin.json
          plugin=$(jq -r '.name' "$pj")
          entry=$(jq -r '.plugins[0].name' "$mp")
          path=$(jq -r '.plugins[0].source.path' "$mp")
          [ "$entry" = "$plugin" ]        || { echo "::error::marketplace.json entry '$entry' ≠ generated plugin.json name '$plugin'"; exit 1; }
          [ "$path" = "plugins/$plugin" ] || { echo "::error::marketplace.json source.path '$path' ≠ plugins/$plugin"; exit 1; }
          echo "ok: $plugin"
