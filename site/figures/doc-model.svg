<svg class="docmodel" viewBox="0 0 1200 640" style="min-width:760px" role="img" aria-label="The document model. Work enters from two sources: an A100 scoping and planning report, or the scrumboard. The A100 feeds a D100 solution architecture and one D101 feature design per feature; a scrumboard design task also enters at a D101. Each D101 feeds a stack of one S100 execution plan and its S101 build specifications. A scrumboard bug fix task skips the design and goes straight to a single S101 build specification. Everything is published on the documentation overview landing site. Colour carries one meaning only: each lane has a colour — violet for source, cyan for design, green for specification — and every arrow takes the colour of the lane it enters.">
  <style>
    .docmodel { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    .docmodel text { font-size: 13px; text-anchor: middle; fill: var(--text, #fff); }
    .docmodel a { cursor: pointer; }
    .docmodel a, .docmodel a:hover { text-decoration: none; }

    /* lane headers and inline notes */
    .docmodel .lane text { font-size: 11px; letter-spacing: 0.16em; text-anchor: start; fill: var(--text-mute, #6b7a93); }
    .docmodel .note { font-size: 10px; letter-spacing: 0.14em; fill: var(--text-mute, #6b7a93); }

    /* group cards: A100, Scrumboard */
    .docmodel .card { fill: var(--bg2, #122039); stroke: var(--border-2, #3b5e8f); stroke-width: 1.5; }
    .docmodel .cardhead rect { fill: var(--border-2, #3b5e8f); fill-opacity: 0.16; }
    .docmodel .cardhead text { font-size: 11px; letter-spacing: 0.08em; text-anchor: start; }
    .docmodel .neutral text { fill: var(--text-mute, #6b7a93); }

    /* one colour per lane */
    /* source — violet tint */
    .docmodel .src rect { fill: var(--violet, #ab47bc); fill-opacity: 0.18; stroke: var(--violet, #ab47bc); stroke-width: 1.5; }
    .docmodel .cardhead.src rect { stroke: none; }
    /* design — cyan tint (the overview bar is a document, so it is cyan too) */
    .docmodel .doc rect { fill: var(--cyan, #4fc3f7); fill-opacity: 0.18; stroke: var(--cyan, #4fc3f7); stroke-width: 1.5; }
    /* specification — green tint */
    .docmodel .spec rect { fill: var(--green, #66bb6a); fill-opacity: 0.16; stroke: var(--green, #66bb6a); stroke-width: 1.25; }
    .docmodel .spec.plan rect { fill-opacity: 0.28; }
    .docmodel .spec text { text-anchor: start; }
    /* scrumboard tasks — not artifacts, no tint, no link */
    .docmodel .task rect { fill: var(--bg3, #1b2e4d); stroke: var(--border, #2b4a73); stroke-width: 1.5; }
    /* the stack container a D101 fans out to */
    .docmodel .stack { fill: var(--bg2, #122039); stroke: var(--border, #2b4a73); stroke-width: 1.25; }

    /* connectors: an arrow takes the colour of the lane it enters */
    .docmodel .flow { fill: none; stroke-width: 1.75; }
    .docmodel .flow.into-design { stroke: var(--cyan, #4fc3f7); }
    .docmodel .flow.into-spec { stroke: var(--green, #66bb6a); }
    .docmodel #dmArrowCyan path { fill: var(--cyan, #4fc3f7); }
    .docmodel #dmArrowGreen path { fill: var(--green, #66bb6a); }

    /* permanent click affordance: a small arrow at the right of every linked box */
    .docmodel .go { font-size: 13px; }
    .docmodel .go.r { text-anchor: end; }
    .docmodel .cardhead .go { font-size: 11px; }
    .docmodel .src .go { fill: var(--violet, #ab47bc); }
    .docmodel .doc .go { fill: var(--cyan, #4fc3f7); }
    .docmodel .spec .go { fill: var(--green, #66bb6a); }

    /* hover affordance on every linked box */
    .docmodel a rect { transition: fill-opacity 0.15s ease; }
    .docmodel a:hover rect { fill-opacity: 0.34; }
  </style>
  <defs>
    <marker id="dmArrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z"/></marker>
    <marker id="dmArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- the landing site: spans the whole figure -->
  <a class="doc" href="/artifacts/documentation/overview.html">
    <title>Open Documentation Overview — the landing site</title>
    <rect x="0.75" y="0.75" width="1198.5" height="46" rx="10"/>
    <text x="600" y="30" style="font-size:14px">Documentation Overview — the landing site<tspan class="go" dx="10">→</tspan></text>
  </a>

