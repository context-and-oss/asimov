<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 200" role="img" aria-label="The delivery model: four fixed phases in a row, Proposal, Scoping, Development, Operations, each with its purpose; an arrow from Operations loops back under the row to Proposal, labelled next engagement. Beneath the phases, one band for approaches chosen per project and one for disciplines exercised under every approach.">
  <defs>
    <marker id="dm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--text-dim,#a8b8d0)"/></marker>
  </defs>
  <!-- phases -->
  <g font-family="Inter, sans-serif" text-anchor="middle">
    <rect x="16" y="20" width="250" height="64" rx="8" fill="var(--bg2,#122039)" stroke="var(--cyan,#4fc3f7)" stroke-width="1.5"/>
    <text x="141" y="47" font-size="14" font-weight="700" fill="#fff">Proposal</text>
    <text x="141" y="68" font-size="11.5" fill="var(--text-dim,#a8b8d0)">sell a scoping</text>

    <rect x="316" y="20" width="250" height="64" rx="8" fill="var(--bg2,#122039)" stroke="var(--cyan,#4fc3f7)" stroke-width="1.5"/>
    <text x="441" y="47" font-size="14" font-weight="700" fill="#fff">Scoping</text>
    <text x="441" y="68" font-size="11.5" fill="var(--text-dim,#a8b8d0)">turn needs into a basis for decision</text>

    <rect x="616" y="20" width="250" height="64" rx="8" fill="var(--bg2,#122039)" stroke="var(--cyan,#4fc3f7)" stroke-width="1.5"/>
    <text x="741" y="47" font-size="14" font-weight="700" fill="#fff">Development</text>
    <text x="741" y="68" font-size="11.5" fill="var(--text-dim,#a8b8d0)">build, implement, put into operation</text>

    <rect x="916" y="20" width="250" height="64" rx="8" fill="var(--bg2,#122039)" stroke="var(--cyan,#4fc3f7)" stroke-width="1.5"/>
    <text x="1041" y="47" font-size="14" font-weight="700" fill="#fff">Operations</text>
    <text x="1041" y="68" font-size="11.5" fill="var(--text-dim,#a8b8d0)">keep it running, close the loop</text>
  </g>
  <!-- forward arrows -->
  <g fill="none" stroke="var(--text-dim,#a8b8d0)" stroke-width="1.5" marker-end="url(#dm-arr)">
    <path d="M266 52 H312"/>
    <path d="M566 52 H612"/>
    <path d="M866 52 H912"/>
    <!-- loop back -->
    <path d="M1041 84 V104 a4 4 0 0 1 -4 4 H145 a4 4 0 0 0 -4 4 V88"/>
  </g>
  <text x="591" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--text-mute,#6b7a93)" letter-spacing="0.12em">NEXT ENGAGEMENT</text>
  <!-- bands -->
  <g font-family="Inter, sans-serif" font-size="12.5">
    <rect x="16" y="124" width="1150" height="30" rx="6" fill="var(--amber,#ffb74d)" fill-opacity="0.1" stroke="var(--amber,#ffb74d)" stroke-width="1.25"/>
    <text x="32" y="144" fill="#fff" font-weight="600">Approaches</text>
    <text x="130" y="144" fill="var(--text-dim,#a8b8d0)">chosen per project: Scrum, Kanban, prototyping, use-case delivery, launch and hyper care</text>

    <rect x="16" y="160" width="1150" height="30" rx="6" fill="var(--green,#66bb6a)" fill-opacity="0.1" stroke="var(--green,#66bb6a)" stroke-width="1.25"/>
    <text x="32" y="180" fill="#fff" font-weight="600">Disciplines</text>
    <text x="130" y="180" fill="var(--text-dim,#a8b8d0)">under every approach: estimation, risk, change handling, status reporting, testing, handover, and the rest</text>
  </g>
</svg>
