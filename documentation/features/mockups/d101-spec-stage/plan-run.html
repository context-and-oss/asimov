<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — one run of /asimov-spec</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
:root { --bg:#1b1b1f; --bg2:#232329; --line:#34343c; --fg:#e6e6e6; --dim:#9a9aa6; --mute:#6c6c78; --user:#d7ba7d; --ok:#8fd18f; --warn:#f0b35a; --bad:#f28b82; --acc:#7cc4ff; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:var(--bg); color:var(--fg); font-family:'JetBrains Mono', ui-monospace, Consolas, monospace; font-size:12.5px; line-height:1.55; display:flex; flex-direction:column; }
.bar { display:flex; gap:0.4rem; align-items:center; padding:0.5rem 0.8rem; background:var(--bg2); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.bar .lbl { color:var(--mute); font-size:11px; margin-right:0.3rem; }
.bar button { font:inherit; font-size:11px; color:var(--dim); background:transparent; border:1px solid var(--line); border-radius:6px; padding:0.25rem 0.6rem; cursor:pointer; }
.bar button.on { color:var(--fg); border-color:var(--acc); background:#7cc4ff14; }
.bar .spacer { flex:1; }
.term { flex:1; overflow:auto; padding:0.9rem 1rem 1.2rem; }
.line { white-space:pre-wrap; word-break:break-word; margin:0 0 0.15rem; }
.u { color:var(--user); }
.u::before { content:'❯ '; color:var(--mute); }
.a::before { content:'● '; color:var(--acc); }
.a.ok::before { color:var(--ok); }
.a.warn::before { color:var(--warn); }
.a.bad::before { color:var(--bad); }
.dim { color:var(--dim); }
.mute { color:var(--mute); }
.blk { margin:0.5rem 0 0.7rem 1.2rem; }
.hd { color:var(--fg); font-weight:700; margin-top:0.5rem; }
table { border-collapse:collapse; margin:0.25rem 0 0.4rem; font-size:12px; }
th, td { text-align:left; padding:0.1rem 0.9rem 0.1rem 0; vertical-align:top; white-space:nowrap; }
th { color:var(--mute); font-weight:500; }
td.w { color:var(--warn); }
.gate { margin:0.6rem 0 0.4rem 1.2rem; padding:0.6rem 0.8rem; border:1px solid var(--line); border-radius:8px; background:var(--bg2); }
.gate .q { color:var(--fg); margin-bottom:0.45rem; }
.gate .row { display:flex; gap:0.45rem; flex-wrap:wrap; align-items:center; }
.gate button { font:inherit; font-size:12px; color:var(--fg); background:#2d2d35; border:1px solid var(--line); border-radius:6px; padding:0.3rem 0.7rem; cursor:pointer; }
.gate button.go { border-color:var(--ok); color:var(--ok); }
.gate button.stop { border-color:var(--bad); color:var(--bad); }
.gate input { font:inherit; font-size:12px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:0.3rem 0.6rem; min-width:260px; flex:1; }
.gate input::placeholder { color:var(--mute); }
.gate .hint { color:var(--mute); font-size:11px; margin-top:0.4rem; }
</style>
</head>
<body>
<div class="bar">
  <span class="lbl">Scenario</span>
  <button data-s="full" class="on">Full run</button>
  <button data-s="ticket">Ticket run</button>
  <button data-s="refused">Not Full design</button>
  <button data-s="resumed">Resumed at the cut</button>
  <button data-s="review">Re-check a ready plan</button>
  <span class="spacer"></span>
  <button id="replay">Replay</button>
</div>
<div class="term" id="term"></div>

<script>
(function () {
  const term = document.getElementById('term');
  let scenario = 'full';
  let timers = [];

  // Sample plan for a generic feature; no product entity.
  const SLUG = 'csv-export';
  const WHO = 'the author';
  const DATE = '2026-10-06';
  const base = () => ([
    { id:'0', name:'Foundation', ac:'—', cp:'both skeletons compile, no bodies', tasks:[
      ['001','skeleton-dotnet','dotnet-builder','.NET',3,'—','§6.1 §6.2'],
      ['002','skeleton-angular','angular-builder','Angular',2,'—','§6.3'] ]},
    { id:'1', name:'Export a filtered list as CSV', ac:'AC1', cp:'AC1 acceptance test green (API level)', tasks:[
      ['003','export-acceptance-test','dotnet-tester','.NET',1,'001','AC1'],
      ['004','export-service','dotnet-builder','.NET',2,'003','AC1 R1 R2'] ]},
    { id:'2', name:'Export button downloads the file', ac:'AC2', cp:'AC2 acceptance test green', tasks:[
      ['005','button-acceptance-test','dotnet-tester','.NET',1,'004','AC2'],
      ['006','export-endpoint','dotnet-builder','.NET',2,'005','AC2 R3'],
      ['007','export-button','angular-builder','Angular',4,'002 006','AC2 R3'] ]},
    { id:'3', name:'Nightly export', ac:'AC3', cp:'AC3 acceptance test green', tasks:[
      ['008','nightly-acceptance-test','dotnet-tester','.NET',1,'004','AC3'],
      ['009','nightly-scheduler','dotnet-builder','.NET',2,'008','AC3 R4 R5'] ]}
  ]);
  let plan = base();
  let notes = [];

  function clear() { timers.forEach(clearTimeout); timers = []; term.innerHTML = ''; }
  function el(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; term.appendChild(d); term.scrollTop = term.scrollHeight; return d; }
  function line(cls, html) { return el('line ' + cls, html); }
  function later(ms, fn) { const t = setTimeout(fn, ms); timers.push(t); return t; }
  function seq(steps) { let t = 0; steps.forEach(([ms, fn]) => { t += ms; later(t, fn); }); return t; }
  const ntasks = () => plan.reduce((a, p) => a + p.tasks.length, 0);
  const warnTasks = () => plan.flatMap(p => p.tasks).filter(t => t[4] > 3);

  // The plan view, as artifact-s101-view prints it (the mockup draws it as a table).
  function view(status, validated) {
    let h = '<div class="blk">';
    h += '<div class="mute">Plan for ' + SLUG + ' · CSV export · D101-' + SLUG + '.html v1.2 · ' + plan.length + ' phases, ' + ntasks() + ' tasks' +
      (validated ? ', ' + validated + ' task specs written, ' + validated + ' validated' : '') + ' · ' + status + '</div>';
    plan.forEach(p => {
      h += '<div class="hd">P' + p.id + ' · ' + p.name + ' <span class="mute">· ' + p.ac + '</span></div>';
      h += '<div class="dim">✓ ' + p.cp + '</div>';
      h += '<table><tr><th>task</th><th>role</th><th>tier</th><th>title</th></tr>';
      p.tasks.forEach(t => { h += '<tr><td>T' + t[0] + '</td><td>' + t[2] + '</td><td>' + (t[0] < '003' ? 'low' : (t[2].endsWith('tester') ? 'mid' : 'mid')) + '</td><td>' + t[1] + '</td></tr>'; });
      h += '</table>';
    });
    h += '<div class="hd">Coverage <span class="mute">· AC1–AC3 delivered · R1–R5 · NF1–NF2 verified by review</span></div>';
    h += '<div class="hd">Assumptions <span class="mute">· ' + (3 + notes.length) + ', of which ' + notes.length + ' corrected at the cut</span></div>';
    h += '<div class="dim">· tier: mid for every builder, low for the skeletons (default)<br>· CSV dialect: RFC 4180, as the design names it<br>· no close phase: nothing ends the run beyond the last slice (default)';
    notes.forEach(x => { h += '<br>· your correction: “' + x + '”'; });
    h += '</div></div>';
    return h;
  }

  function remains() {
    let h = '<div class="blk dim"><div class="hd">What the checks left</div>';
    const w = warnTasks();
    if (!w.length) h += 'nothing: every check passed';
    w.forEach(t => { h += '<span style="color:var(--warn)">Warn</span> · T' + t[0] + ' ' + t[1] + ' · owns ' + t[4] + ' non-test files, above the threshold of 3; the plan is written as is.'; });
    return h + '</div>';
  }

  function gate() {
    const g = document.createElement('div');
    g.className = 'gate';
    g.innerHTML = '<div class="q">Say <b>go</b> to approve this plan and have its ' + ntasks() + ' task specs written, or correct it first.</div>' +
      '<div class="row">' +
        '<button class="go">Go</button>' +
        '<input type="text" placeholder="correct the cut in your own words — e.g. “merge phase 2 and 3”">' +
        '<button class="send">Correct</button>' +
        '<button class="stop">Stop</button>' +
      '</div>' +
      '<div class="hint">The go is your approval of the plan: it is written into S101-' + SLUG + '.md with your name, the date and a fingerprint of the plan. You can also edit the file by hand and say “read again”. The go is not one of the five questions.</div>';
    term.appendChild(g); term.scrollTop = term.scrollHeight;
    const input = g.querySelector('input');
    const done = () => { g.querySelectorAll('button,input').forEach(b => b.disabled = true); g.style.opacity = 0.6; };
    g.querySelector('.go').onclick = () => { done(); line('u', 'go'); expand(); };
    g.querySelector('.stop').onclick = () => { done(); line('u', 'stop'); stopAtCut(); };
    const send = () => { const v = input.value.trim(); if (!v) return; done(); line('u', v); correct(v); };
    g.querySelector('.send').onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    input.focus();
  }

  // Cut in a writer subagent, check in a validator subagent; a Fail is re-cut unseen.
  function cutAndCheck(heading, withFail) {
    const steps = [
      [0, () => line('dim', '  cut    ' + plan.length + ' phases · ' + ntasks() + ' tasks · S101-' + SLUG + '.md written (draft)')]
    ];
    if (withFail) {
      steps.push([500, () => line('dim', '  check  1 fail · re-cutting (1/3)')]);
      steps.push([600, () => line('dim', '  cut    ' + plan.length + ' phases · ' + ntasks() + ' tasks · S101-' + SLUG + '.md rewritten (draft)')]);
    }
    steps.push([500, () => line('dim', '  check  clean · 0 flag · ' + warnTasks().length + ' warn')]);
    steps.push([300, () => line('a', heading)]);
    steps.push([250, () => el('', view('draft · not approved'))]);
    steps.push([200, () => el('', remains())]);
    steps.push([250, gate]);
    seq(steps);
  }

  function correct(text) {
    const t = text.toLowerCase();
    if (/read again|læs igen/.test(t)) {
      seq([
        [300, () => line('a', 'Checking S101-' + SLUG + '.md as you edited it …')],
        [300, () => cutAndCheck('The cut, as edited:', false)]
      ]);
      return;
    }
    if (/merge|slå|sammen|combine|join|one phase|én fase/.test(t) && plan.length === 4) {
      const p2 = plan[2], p3 = plan[3];
      plan = [plan[0], plan[1], { id:'2', name:p2.name + ' + ' + p3.name, ac:'AC2 AC3', cp:'AC2 and AC3 acceptance tests green', tasks:[...p2.tasks, ...p3.tasks] }];
    } else if (/split|del op|separate|two phases/.test(t) && plan.length === 3) {
      plan = base();
    } else {
      const sched = plan.flatMap(p => p.tasks).find(x => x[0] === '009');
      if (sched) sched[5] = '004';
      notes.push(text);
    }
    seq([
      [300, () => line('a', 'Re-cutting with your correction, then checking it …')],
      [500, () => cutAndCheck('The cut, re-cut:', false)]
    ]);
  }

  function stopAtCut() {
    seq([
      [300, () => line('a ok', 'Stopped at the cut. S101-' + SLUG + '.md is on disk (draft, not approved), no S102 written.')],
      [200, () => line('dim', '  Run /asimov-spec ' + SLUG + ' again to continue; the cut is shown first.')]
    ]);
  }

  function approveGate() {
    const g = document.createElement('div');
    g.className = 'gate';
    g.innerHTML = '<div class="q">Say <b>approve</b> to approve the plan as it now stands and set it ready, or <b>stop</b> to leave it draft.</div>' +
      '<div class="row"><button class="go">Approve</button><button class="stop">Stop</button></div>';
    term.appendChild(g); term.scrollTop = term.scrollHeight;
    const done = () => { g.querySelectorAll('button').forEach(b => b.disabled = true); g.style.opacity = 0.6; };
    g.querySelector('.go').onclick = () => { done(); line('u', 'approve'); seq([
      [300, () => line('dim', '  approved  by ' + WHO + ' · ' + DATE + ' · 7c41e09b2d5a · status: ready')],
      [300, () => line('a ok', 'Ready: ' + ntasks() + ' task specs validated, plan approved by ' + WHO + ' on ' + DATE + '. /asimov-build ' + SLUG + ' builds it; name me again after a hand edit and I re-check it.')]
    ]); };
    g.querySelector('.stop').onclick = () => { done(); line('u', 'stop'); seq([
      [300, () => line('a', 'Left at draft with the previous approval superseded. Run /asimov-spec ' + SLUG + ' to review and approve it; the cut is shown first.')]
    ]); };
  }

  // After the go: a writer subagent and a validator subagent per task, one line each.
  function expand() {
    const tasks = plan.flatMap(p => p.tasks);
    const steps = [
      [300, () => line('dim', '  approved  by ' + WHO + ' · ' + DATE + ' · 3f9c2a1b7e4d')],
      [200, () => line('a', 'Writing ' + tasks.length + ' task specs; each is checked blind and marked validated when it clears. Nothing is asked until the end.')]
    ];
    tasks.forEach(t => {
      steps.push([260, () => line('dim', '  write  T' + t[0] + '  S102-' + SLUG + '-' + t[0] + '-' + t[1] + '.md')]);
      if (t[0] === '007') {
        steps.push([420, () => line('dim', '  check  T' + t[0] + '  <span style="color:var(--bad)">failed</span> · rewriting (1/3)')]);
        steps.push([300, () => line('dim', '  write  T' + t[0] + '  S102-' + SLUG + '-' + t[0] + '-' + t[1] + '.md')]);
        steps.push([420, () => line('dim', '  check  T' + t[0] + '  <span style="color:var(--ok)">validated</span> · 0 flag · <span style="color:var(--warn)">1 warn</span>')]);
      } else {
        steps.push([380, () => line('dim', '  check  T' + t[0] + '  <span style="color:var(--ok)">validated</span> · 0 flag · 0 warn')]);
      }
    });
    steps.push([500, () => line('dim', '  plan   10 pass · 0 flag · 0 fail · 1 warn')]);
    steps.push([400, () => line('dim', '  finalise  §1 +1 row · §3 unchanged · §6 +1')]);
    steps.push([400, () => line('a', 'The plan changed after your go, so it needs your approval again. Sidecar S101-' + SLUG + '.review.md written.')]);
    steps.push([250, () => el('', view('draft · approved by ' + WHO + ' ' + DATE + ', superseded', tasks.length))]);
    steps.push([200, () => el('blk dim', '<div class="hd">What changed since your go</div>· finalise: §1 Contracts +1 row, ExportRequest consumed by T007 (its rewrite took the name from the contracts table)<br>· finalise: §6 Assumptions +1, the interface taken from §1 rather than restated')]);
    steps.push([200, () => el('', remains())]);
    steps.push([250, approveGate]);
    seq(steps);
  }

  function fullRun() {
    seq([
      [0, () => line('u', '/asimov-spec ' + SLUG)],
      [300, () => line('a', 'Planning D101-' + SLUG + '.html into documentation/specs/' + SLUG + '/: I\'ll read the design and the repo, ask at most five questions, check the cut and show it, and wait for your go, which approves the plan, before any task spec is written.')],
      [400, () => line('a', 'Reading D101-' + SLUG + '.html (Full design v1.2), conventions/dotnet, conventions/angular, documentation/specs/ …')],
      [700, () => line('dim', '  3 acceptance criteria buildable · 2 stacks · no existing S101 · 2 questions about the cut, the rest decided by default')],
      [500, () => line('a', 'Q1 of 2 · AC2 and AC3 both read the export service. One slice or two?  <span class="dim">default: two — different checkpoints</span>')],
      [900, () => line('u', 'two')],
      [400, () => line('a', 'Q2 of 2 · Should phase 3 (nightly) depend on phase 2 (button), or only on the service?  <span class="dim">default: only on the service — they can run in parallel</span>')],
      [900, () => line('u', 'default')],
      [400, () => line('a', 'Cutting the plan and checking it; you see it once it is clean …')],
      [600, () => cutAndCheck('The cut:', true)]
    ]);
  }

  function ticketRun() {
    seq([
      [0, () => line('u', '/asimov-spec https://jira.example/browse/OPS-412')],
      [300, () => line('a', 'Planning OPS-412 into documentation/specs/ops-412/: I\'ll read the ticket and the repo, ask at most five questions, check the cut and show it, and wait for your go, which approves the plan, before any task spec is written.')],
      [400, () => line('a', 'Reading OPS-412 and its 5 comments through the Jira connector, then conventions/dotnet, conventions/angular, documentation/specs/ …')],
      [700, () => line('dim', '  Design OPS-412 · approved by the product owner on 2026-10-02 (comment) · R1–R3 · AC1–AC3 · OOS1–OOS2 · no NF · cache documentation/specs/ops-412/design.md written')],
      [500, () => line('dim', '  3 acceptance criteria buildable · 2 stacks · no existing S101 · 1 question about the cut, the rest decided by default')],
      [500, () => line('a', 'Q1 of 1 · AC2 and AC3 both read the export service. One slice or two?  <span class="dim">default: two — different checkpoints</span>')],
      [900, () => line('u', 'default')],
      [400, () => line('a', 'Cutting the plan and checking it; you see it once it is clean …')],
      [600, () => cutAndCheck('The cut:', false)]
    ]);
  }

  function refused() {
    seq([
      [0, () => line('u', '/asimov-spec ' + SLUG)],
      [400, () => line('a', 'Reading D101-' + SLUG + '.html …')],
      [500, () => line('a bad', 'Refused. D101-' + SLUG + ' is at <b>Business design</b>: §6 is still open (3 items). The plan needs a D101 at Full design.')],
      [200, () => line('dim', '  Nothing written. Finish §6 with /asimov-design, then run this again.')],
      [500, () => line('u', '/asimov-spec https://jira.example/browse/OPS-418')],
      [400, () => line('a', 'Reading OPS-418 and its 2 comments through the Jira connector …')],
      [500, () => line('a bad', 'Refused. OPS-418 misses two members of the design contract: no <b>approval</b> by a named person in the thread, and no <b>acceptance criteria</b>.')],
      [200, () => line('dim', '  Nothing written. Add them to the ticket, then name me again with the link.')]
    ]);
  }

  function resumed() {
    seq([
      [0, () => line('u', '/asimov-spec ' + SLUG)],
      [400, () => line('a', 'Reading D101-' + SLUG + '.html (Full design v1.2) and documentation/specs/' + SLUG + '/ …')],
      [600, () => line('dim', '  found S101-' + SLUG + '.md (draft, not approved, 2026-10-01) with no S102 · D101 R/NF/AC ids unchanged · no questions this time')],
      [400, () => line('a', 'Checking the cut as left on disk …')],
      [500, () => cutAndCheck('The cut, as left on disk:', false)]
    ]);
  }

  function review() {
    seq([
      [0, () => line('u', '/asimov-spec ' + SLUG)],
      [300, () => line('a', 'The plan under documentation/specs/' + SLUG + '/ is ready, but it changed after ' + WHO + ' approved it on ' + DATE + ': re-checking every task spec and the plan, each in a fresh subagent; a task spec that fails is rewritten, and you approve the plan again at the end.')],
      [400, () => line('a', 'Re-checking: documentation/specs/' + SLUG + '/S101-' + SLUG + '.md · ready v0.2 · approved by ' + WHO + ' ' + DATE + ' · 9 S102s · D101-' + SLUG + '.html v1.2')],
      [400, () => line('a', 'The plan, re-checked:')],
      [250, () => el('', view('ready · plan approved by ' + WHO + ' ' + DATE, 9))],
      [500, () => el('blk dim', '  check  T001 clears · T002 clears · T003 clears · T004 clears · T005 clears · T006 clears<br>  check  T007 clears · <span style="color:var(--warn)">1 warn</span><br>  check  T009 <span style="color:var(--bad)">fails</span> · 1 flag · <span style="color:var(--bad)">no longer clears</span><br>  check  T008 clears')],
      [500, () => line('dim', '  plan   9 pass · 0 flag · 1 fail · 1 warn')],
      [400, () => el('blk dim', '<div class="hd">What the checks found</div><span style="color:var(--bad)">Fail</span> · T009 nightly-scheduler · its §4 line “no new package” contradicts S101 §2 constraint 2, which names the scheduler package the design imposes.<br><span style="color:var(--bad)">Fail</span> · T009 · done-when 3 names no runnable check.<br><span style="color:var(--warn)">Warn</span> · T007 export-button · owns 4 non-test files, above the threshold of 3.')],
      [400, () => line('dim', '  write  T009  S102-' + SLUG + '-009-nightly-scheduler.md · rewritten with the findings')],
      [400, () => line('dim', '  check  T009  <span style="color:var(--ok)">validated</span> · 0 flag · 0 warn')],
      [400, () => line('a', 'Every task spec clears again; the plan changed since your go, so it needs your approval again. Sidecar S101-' + SLUG + '.review.md written.')],
      [250, approveGate]
    ]);
  }

  function run() {
    clear(); plan = base(); notes = [];
    ({ full: fullRun, ticket: ticketRun, refused: refused, resumed: resumed, review: review })[scenario]();
  }

  document.querySelectorAll('.bar button[data-s]').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.bar button[data-s]').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); scenario = b.dataset.s; run();
    };
  });
  document.getElementById('replay').onclick = run;
  run();
})();
</script>
</body>
</html>
