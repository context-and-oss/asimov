<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — what /asimov-risk prints</title>
<style>
/* Styled after the plan-view transcript of the Spec stage (mockups/d101-spec-stage/plan-run.html). */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
:root { --bg:#1b1b1f; --bg2:#232329; --line:#34343c; --fg:#e6e6e6; --dim:#9a9aa6; --mute:#6c6c78; --user:#d7ba7d; --ok:#8fd18f; --warn:#f0b35a; --bad:#f28b82; --acc:#7cc4ff; --vio:#c58af9; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:var(--bg); color:var(--fg); font-family:'JetBrains Mono', ui-monospace, Consolas, monospace; font-size:12.5px; line-height:1.55; display:flex; flex-direction:column; }
.bar { display:flex; gap:0.4rem; align-items:center; padding:0.5rem 0.8rem; background:var(--bg2); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.bar .lbl { color:var(--mute); font-size:11px; margin-right:0.3rem; }
.bar button { font:inherit; font-size:11px; color:var(--dim); background:transparent; border:1px solid var(--line); border-radius:6px; padding:0.25rem 0.6rem; cursor:pointer; }
.bar button.on { color:var(--fg); border-color:var(--acc); background:#7cc4ff14; }
.term { flex:1; overflow:auto; padding:0.9rem 1rem 1.2rem; }
.line { white-space:pre-wrap; word-break:break-word; margin:0 0 0.15rem; }
.u { color:var(--user); }
.u::before { content:'❯ '; color:var(--mute); }
.a::before { content:'● '; color:var(--acc); }
.a.ok::before { color:var(--ok); }
.a.warn::before { color:var(--warn); }
.a.bad::before { color:var(--bad); }
.dim { color:var(--dim); }
.mute { color:var(--mute); }
pre.view { margin:0.4rem 0 0.6rem 1.2rem; padding:0.6rem 0.8rem; border-left:2px solid var(--line); color:var(--fg); white-space:pre; overflow-x:auto; font:inherit; }
pre.view .h { color:var(--fg); font-weight:700; }
pre.view .m { color:var(--mute); }
pre.view .s-Active { color:var(--warn); }
pre.view .s-Mitigated { color:var(--acc); }
pre.view .s-Accepted { color:var(--vio); }
pre.view .s-Occurred { color:var(--bad); }
pre.view .s-Resolved { color:var(--ok); }
.diff { margin:0.3rem 0 0.5rem 1.2rem; }
.diff .b { color:var(--bad); }
.diff .f { color:var(--ok); }
.gate { margin:0.6rem 0 0.4rem 1.2rem; padding:0.6rem 0.8rem; border:1px solid var(--line); border-radius:8px; background:var(--bg2); }
.gate .q { color:var(--fg); margin-bottom:0.45rem; }
.gate .row { display:flex; gap:0.45rem; flex-wrap:wrap; }
.gate button { font:inherit; font-size:12px; color:var(--fg); background:#2d2d35; border:1px solid var(--line); border-radius:6px; padding:0.3rem 0.7rem; cursor:pointer; }
.gate button.go { border-color:var(--ok); color:var(--ok); }
.gate button:disabled { opacity:0.45; cursor:default; }
</style>
</head>
<body>
<div class="bar">
  <span class="lbl">Scenario</span>
  <button data-s="review" class="on">Weekly review</button>
  <button data-s="add">Register a risk</button>
  <button data-s="accept">Decide a state</button>
  <button data-s="handover">Hand over risks</button>
  <button data-s="none">No register yet</button>
  <button data-s="optout">Opt-out stands</button>
  <button data-s="repair">Unreadable register</button>
</div>
<div class="term" id="term"></div>

<script>
(function () {
  const term = document.getElementById('term');
  const MATURITY = 'The risk log is an assess-level artifact: the definition is untried and may change without notice. Feedback is welcome.';
  // [id, score, name, owner, changed, state, area, impact, probability, description, mitigation]
  const RISKS = [
    ['RISK-005',16,'Unclear specifications slow the build agents','Sara Nygaard','2026-10-12','Active','Quality',4,4,
      'Two features reached the build with open questions the design had not closed.',
      'Gap-review every design before planning; no plan from a design with open business questions.'],
    ['RISK-001',12,'Sponsor changes mid-engagement','Maja Holm','2026-10-06','Active','Governance',4,3,
      'The sponsor has announced a reorganisation; a new sponsor may reopen scope.',
      'Brief the deputy sponsor on every steering decision so the context survives a change.'],
    ['RISK-003',10,'Key developer leaves before handover','Maja Holm','2026-09-23','Mitigated','Resources',5,2,
      '',
      'Pair on every module; handover notes written weekly, not at the end.'],
    ['RISK-004', 6,'Third-party API pricing changes','Jonas Berg','2026-09-30','Accepted','Cost',2,3,
      'The vendor has signalled a new price model from next year.',
      ''],
    ['RISK-002',12,'Customer test environment arrives late','Jonas Berg','2026-10-13','Occurred','Schedule',3,4,
      '',
      ''],
    ['RISK-006', 8,'Data migration exceeds the cut-over window','Jonas Berg','2026-10-06','Resolved','Schedule',4,2,'','']
  ];
  const ORDER = ['Active','Mitigated','Accepted','Occurred','Resolved'];
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const IND = ' '.repeat(16);
  // Wrap text to 80 columns, every line after the first indented to the text column.
  function wrap(text, first) {
    const words = text.split(' '); const lines = []; let line = first;
    words.forEach(w => { if ((line + w).length > 80) { lines.push(line.replace(/\s+$/, '')); line = IND; } line += w + ' '; });
    lines.push(line.replace(/\s+$/, ''));
    return lines.map(esc).join('\n') + '\n';
  }

  // The fixed view, as artifact-risk-log-view prints it: 80 columns, state groups, score descending,
  // every open risk in full (R30), Resolved only as a count.
  function view(risks, updated) {
    const n = s => risks.filter(r => r[5] === s).length;
    let h = '<span class="h">Risk log · documentation/project/risk-log.html</span>\n';
    h += '<span class="m">Updated ' + updated + ' · ' + risks.length + ' risks</span>\n';
    h += '<span class="m">' + ORDER.map(s => n(s) + ' ' + s).join(' · ') + '</span>\n\n';
    ORDER.forEach(s => {
      const rows = risks.filter(r => r[5] === s);
      if (!rows.length) return;
      h += '<span class="s-' + s + '">' + s + (s === 'Resolved' ? ' (' + rows.length + ')' : '') + '</span>\n';
      if (s === 'Resolved') return;
      rows.forEach(r => {
        h += '  ' + r[0] + '  ' + String(r[1]).padStart(2) + '  ' + esc(r[2]) + '\n';
        h += IND + '<span class="m">' + esc(r[3] + ' · ' + r[6] + ' · I' + r[7] + ' P' + r[8] + ' · changed ' + r[4]) + '</span>\n';
        h += r[9] ? wrap(r[9], IND) : IND + '<span class="m">Description: none written</span>\n';
        h += r[10] ? wrap(r[10], '     Mitigation ') : '     Mitigation <span style="color:var(--warn)">none written</span>\n';
        h += '<span class="m">  ' + '─'.repeat(78) + '</span>\n';
      });
      h += '\n';
    });
    return '<pre class="view">' + h.replace(/\n\n$/, '\n') + '</pre>';
  }

  function clear() { term.innerHTML = ''; }
  function add(html) { const d = document.createElement('div'); d.innerHTML = html; while (d.firstChild) term.appendChild(d.firstChild); term.scrollTop = term.scrollHeight; }
  const u = t => '<div class="line u">' + esc(t) + '</div>';
  const a = (t, c) => '<div class="line a ' + (c || '') + '">' + t + '</div>';
  const dim = t => '<div class="line dim" style="margin-left:1.2rem">' + t + '</div>';

  function gate(q, buttons) {
    const g = document.createElement('div'); g.className = 'gate';
    g.innerHTML = '<div class="q">' + q + '</div><div class="row"></div>';
    const row = g.querySelector('.row');
    buttons.forEach(([label, cls, fn]) => {
      const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
      b.addEventListener('click', () => { row.querySelectorAll('button').forEach(x => x.disabled = true); add(u(label)); fn(); });
      row.appendChild(b);
    });
    term.appendChild(g);
  }

  const S = {
    review() {
      add(u('/asimov-risk'));
      add(a('Showing the risk log; I ask at the end whether to mark it reviewed.'));
      add(a(MATURITY, 'warn'));
      add(view(RISKS, '2026-10-06'));
      gate('Mark the register as reviewed today?', [
        ['Yes', 'go', () => gate('Who took part? (skip to record only you)', [
          ['Erik Lund, Jonas Berg', 'go', () => add(a('Register reviewed 2026-10-13 by Maja Holm with Erik Lund, Jonas Berg. No risk changed.', 'ok'))],
          ['Skip', '', () => add(a('Register reviewed 2026-10-13 by Maja Holm. No risk changed.', 'ok'))]
        ])],
        ['No', '', () => add(a('Nothing written.'))]
      ]);
    },
    add() {
      add(u('/asimov-risk tilføj: kunden når ikke at frigive testere før uge 48'));
      add(a('Jeg registrerer en ny risiko i documentation/project/risk-log.html. Projektets sprog er engelsk, så jeg viser den engelske tekst, før noget gemmes.'));
      add(a('The risk log is an assess-level artifact: the definition is untried and may change without notice. Feedback is welcome.', 'warn'));
      add(a('Hvem ejer risikoen? Og konsekvens og sandsynlighed, 1–5 hver (konsekvens 1 = klares inden for ugen, 5 = truer målet; sandsynlighed 1 = ville overraske os, 5 = forventet, medmindre vi handler).'));
      add(u('Jonas, konsekvens 4, sandsynlighed 3, område Schedule, ingen mitigation endnu'));
      add(a('Ejer: Jonas Berg? Sådan gemmes den, på engelsk:'));
      add(dim('Name   The customer cannot release testers before week 48<br>Owner  Jonas Berg · Impact 4 · Probability 3 (score 12) · Area Schedule · Active'));
      gate('Gem RISK-007 sådan, eller ret den engelske tekst?', [
        ['Gem den', 'go', () => add(a('RISK-007 gemt, Active, score 12. Historik: 2026-10-13 · Maja Holm · Created.', 'ok'))],
        ['Ret teksten', '', () => {
          add(a('Skriv navnet, som det skal stå på engelsk:'));
          add(u('Customer testers not released before week 48'));
          add(a('RISK-007 gemt med dit navn: “Customer testers not released before week 48”. Active, score 12.', 'ok'));
        }]
      ]);
    },
    handover() {
      add(u('/asimov-risk Jonas Berg leaves at the end of the month, give his risks to Sara Nygaard'));
      add(a('Handing Jonas Berg\'s open risks to Sara Nygaard.'));
      add(a(MATURITY, 'warn'));
      add(a('Jonas Berg owns three open risks: RISK-002 (Occurred), RISK-004 (Accepted), RISK-007 (Active). RISK-006 is Resolved and keeps its owner.'));
      gate('Give RISK-002, RISK-004 and RISK-007 to Sara Nygaard?', [
        ['Yes', 'go', () => add(a('Three risks now owned by Sara Nygaard, each with the history line “Owner: Jonas Berg → Sara Nygaard (handover)”.', 'ok'))],
        ['No', '', () => add(a('Nothing written.'))]
      ]);
    },
    accept() {
      add(u('/asimov-risk accept RISK-004'));
      add(a('Setting RISK-004 Third-party API pricing changes from Active to Accepted.'));
      add(a(MATURITY, 'warn'));
      add(a('Accepted needs a reason and the person who decided. Why is it lived with, and who decided?'));
      add(u('we live with it'));
      add(a('Who decided to live with it? Without a name it is not set.', 'warn'));
      add(u('Erik Lund, the customer carries API costs under the contract'));
      gate('Set RISK-004 Accepted · reason: the customer carries API costs under the contract · decided by Erik Lund?', [
        ['Set it', 'go', () => add(a('RISK-004 Accepted. History: 2026-10-13 · Maja Holm · Active → Accepted: the customer carries API costs under the contract. Decided by Erik Lund.', 'ok'))],
        ['Cancel', '', () => add(a('Nothing written.'))]
      ]);
    },
    none() {
      add(u('/asimov-risk'));
      add(a('Looking for documentation/project/risk-log.html.'));
      add(a(MATURITY, 'warn'));
      add(a('No risk register and no opt-out in this repo yet.', 'warn'));
      gate('Start a register with its first risk, or record that no register is kept here?', [
        ['Register a risk', 'go', () => add(a('Which language is the project kept in? <span class="dim">(suggested: English, the language of this conversation)</span>'))],
        ['Record an opt-out', '', () => add(a('Why: handled elsewhere (say where), or risks are not worked with on this engagement? And who decided?'))]
      ]);
    },
    optout() {
      add(u('/asimov-risk'));
      add(a('Showing the risk log.'));
      add(a(MATURITY, 'warn'));
      add('<pre class="view"><span class="h">Risk log · documentation/project/risk-log.html</span>\n<span class="s-Accepted">No register kept here</span>\nHandled elsewhere: the customer’s project tool, PMO board\n<span class="m">Decided by Erik Lund · 2026-09-30</span></pre>');
      add(a('Registering a risk replaces the opt-out with a register; say <span class="dim">add</span> to start.'));
    },
    repair() {
      add(u('/asimov-risk'));
      add(a('Reading documentation/project/risk-log.html.'));
      add(a(MATURITY, 'warn'));
      add(a('The register cannot be read in full, so I will not write to it. Proposed repair:', 'bad'));
      add('<div class="diff">' +
        '<div class="line">RISK-005 impact      <span class="b">(missing)</span> → <span class="f">asked: what is it?</span></div>' +
        '<div class="line">RISK-002 history     <span class="b">line without a date</span> → <span class="f">kept as written; asked: which date?</span></div>' +
        '</div>');
      add(u('impact 4, and the history line is from 2026-09-09'));
      gate('Write the repair? Every risk and history line is kept; the register gains a “Repaired” line.', [
        ['Write the repair', 'go', () => { add(a('Register repaired. History: 2026-10-13 · Maja Holm · Repaired: RISK-005 impact (missing) → 4; RISK-002 history line dated 2026-09-09.', 'ok')); add(view(RISKS, '2026-10-13')); }],
        ['Not now', '', () => add(a('Nothing written. The register stays unreadable until it is repaired, here or by hand.'))]
      ]);
    }
  };

  function run(s) { clear(); S[s](); }
  document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b));
    run(b.dataset.s);
  }));
  run('review');
})();
</script>
</body>
</html>
